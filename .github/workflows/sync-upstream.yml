name: Sync Latest Version (Review Branch)

on:
  schedule:
    # GitHub Actions 使用 UTC；台灣時間每週一 04:15 執行。
    - cron: "15 20 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository != 'TedLin1993/taiwan-fin-hub' && github.repository != 'TedLin1993/all-set-tw'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deployed repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync upstream into review branch
        id: sync
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "taiwan-fin-hub-updater"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch="upstream-sync/$(date -u +%Y%m%d)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          before="$(git rev-parse HEAD)"

          # 只執行 repo 內已審查過的 updater，不在執行期間從上游下載 script。
          SYNC_TARGET_BRANCH="$branch" node scripts/sync-upstream.mjs

          if [ "$(git rev-parse HEAD)" = "$before" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarize review branch
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        env:
          BRANCH: ${{ steps.sync.outputs.branch }}
        run: |
          set -euo pipefail

          upstream="$(git log -1 --format=%B | sed -n 's/^Taiwan-Fin-Hub-Upstream: //p' | tail -n 1)"
          previous="$(git log origin/main --format=%B --grep 'Taiwan-Fin-Hub-Upstream:' -1 | sed -n 's/^Taiwan-Fin-Hub-Upstream: //p' | tail -n 1)"

          if [ -n "$previous" ]; then
            changes="https://github.com/TedLin1993/all-set-tw/compare/${previous}...${upstream}"
          else
            changes="https://github.com/TedLin1993/all-set-tw/commits/${upstream}"
          fi

          # 不由 Actions 開 PR；由使用者從 compare 頁面自行建立並審查。
          {
            echo "## 上游同步待審查"
            echo ""
            echo "- 開 PR：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
            echo "- 上游版本：https://github.com/TedLin1993/all-set-tw/commit/${upstream}"
            echo "- 上游變更：${changes}"
            echo ""
            echo "審查完成後請用 **Create a merge commit** 或 **Rebase and merge** 合併，保留 \`Taiwan-Fin-Hub-Upstream\` 紀錄。"
          } >> "$GITHUB_STEP_SUMMARY"
